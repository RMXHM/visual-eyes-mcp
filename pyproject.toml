[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "visual-eyes-mcp"
version = "0.1.0"
description = "MCP server for video understanding and visual analysis"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["mcp", "video", "gemini", "ffmpeg", "vision"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "mcp>=2.3,<3",
  "google-genai>=3.3,<4",
  "pydantic>=2.12,<3",
]

[project.scripts]
visual-eyes-mcp = "visual_eyes_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/visual_eyes_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: makes a real, billable Gemini API call; opt in with VISUAL_EYES_RUN_INTEGRATION=1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
